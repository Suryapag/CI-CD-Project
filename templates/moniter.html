<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
}

h1 {
    text-align: center;
}

form {
    margin-bottom: 20px;
    text-align: center;
}

label {
    margin-right: 10px;
}

button {
    padding: 5px 10px;
}

pre {
    background-color: #f4f4f4;
    padding: 10px;
    border: 1px solid #ddd;
}

    </style>
    <script>
        function fetchNetworkMetrics() {
            const hostname = document.getElementById('hostname').value;
            const url = `/network-monitor?hostname=${hostname}`;
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Network response was not ok. Status: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Display the ping and traceroute results in the HTML
                    document.getElementById('pingResult').innerText = data.ping;
                    document.getElementById('tracerouteResult').innerText = data.traceroute;
                })
                .catch(error => {
                    console.error('Error fetching network metrics:', error);
                    alert('Failed to retrieve network metrics. Error: ' + error.message);
                });
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Network Monitoring</h1>
        <form onsubmit="event.preventDefault(); fetchNetworkMetrics();">
            <label for="hostname">Hostname:</label>
            <input type="text" id="hostname" name="hostname" placeholder="Enter hostname (e.g., google.com)" required>
            <button type="submit">Monitor</button>
        </form>

        <h2>Ping Result:</h2>
        <pre id="pingResult">No data yet...</pre>

        <h2>Traceroute Result:</h2>
        <pre id="tracerouteResult">No data yet...</pre>
    </div>
</body>
</html>
